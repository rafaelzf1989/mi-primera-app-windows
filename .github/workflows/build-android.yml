name: Construir APK de Android (PTT Client)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK del sistema
        uses: android-actions/setup-android@v3

      - name: Instalar build-tools y aceptar licencias
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip3 install --upgrade buildozer cython virtualenv

      - name: Construir el APK con Buildozer
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo y | buildozer android debug
        timeout-minutes: 60

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PTT-Client-Android-APK
          path: bin/*.apk
          if-no-files-found: error
